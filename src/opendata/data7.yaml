#
# Data7 datasets definition.
#

# ---- DEFAULT ---------------------------------
default:
  datasets:
    - basename: statuses
      query: >-
        SELECT
          id_pdc_itinerance,
          etat_pdc,
          occupation_pdc,
          horodatage,
          etat_prise_type_2,
          etat_prise_type_combo_ccs,
          etat_prise_type_chademo,
          etat_prise_type_ef
        FROM
          LatestStatus
    - basename: tariffs
      query: >-
        WITH tariff_charge_points AS (
          SELECT
            pointdechargetariff.tariff_id,
            jsonb_agg(
              pointdecharge.id_pdc_itinerance
              ORDER BY pointdecharge.id_pdc_itinerance
            ) FILTER (
              WHERE pointdecharge.id_pdc_itinerance IS NOT NULL
            ) AS id_pdc_itinerance
          FROM
            pointdechargetariff
          INNER JOIN
            pointdecharge
            ON pointdecharge.id = pointdechargetariff.point_de_charge_id
          GROUP BY
            pointdechargetariff.tariff_id
        )
        SELECT
          tariff.raw::text AS raw,
          tariff.start,
          tariff."end",
          COALESCE(
            tariff_charge_points.id_pdc_itinerance,
            '[]'::jsonb
          )::text AS id_pdc_itinerance
        FROM
          tariff
        LEFT JOIN
          tariff_charge_points
          ON tariff_charge_points.tariff_id = tariff.id
        WHERE
          tariff.deleted_at IS NULL
    - basename: statiques
      query: >-
        SELECT
          nom_amenageur,
          siren_amenageur,
          contact_amenageur,
          nom_operateur,
          contact_operateur,
          telephone_operateur,
          nom_enseigne,
          id_station_itinerance,
          id_station_local,
          nom_station,
          implantation_station,
          adresse_station,
          code_insee_commune,
          ST_AsGeoJSON ("coordonneesXY"::geometry)::json -> 'coordinates' AS "coordonneesXY",
          nbre_pdc,
          id_pdc_itinerance,
          id_pdc_local,
          puissance_nominale,
          prise_type_ef,
          prise_type_2,
          prise_type_combo_ccs,
          prise_type_chademo,
          prise_type_autre,
          gratuit,
          paiement_acte,
          paiement_cb,
          paiement_autre,
          tarification,
          condition_acces,
          reservation,
          horaires,
          accessibilite_pmr,
          restriction_gabarit,
          station_deux_roues,
          raccordement,
          num_pdl,
          date_mise_en_service,
          observations,
          date_maj,
          cable_t2_attache
        FROM
          Statique
